# Local Postgres for the Phase 2 job queue. Production is Neon; the worker only
# ever sees DATABASE_URL, so moving between them is a config change.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ytm
      POSTGRES_PASSWORD: ytm
      POSTGRES_DB: ytm
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytm -d ytm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
