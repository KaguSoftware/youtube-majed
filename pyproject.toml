[project]
name = "youtube-majed-pipeline"
version = "0.1.0"
description = "Research-to-video pipeline: worker, benchmarks, assembly"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Phase 0 benchmark only. Image backends are installed per-backend
# so a broken backend can never block the whole harness.
bench = []
mlx = ["mlx>=0.32.0", "mlx-lm", "pillow", "numpy"]
comfy = ["requests", "pillow"]

# Phase 1 vertical slice. Pins here are not housekeeping — each one is a
# failure already paid for (failure mode 10), so they carry their reason.
slice = [
    "mflux==0.23.0",
    "mlx>=0.32.0",

    # pillow 13.0.0 ships a `_typing` module that imports a private name from
    # `numbers` and crashes on Python 3.12 (PLAN.md 8.6).
    "pillow==12.3.0",

    "kokoro==0.9.4",
    "soundfile",

    # preshed 3.0.14 breaks spaCy model loading outright:
    # "OverflowError: Python int too large to convert to C ssize_t" while
    # iterating tokenizer special-case keys. Kokoro's English G2P needs the
    # spaCy POS tagger, so this takes TTS down with it (PLAN.md 8.12).
    "preshed==3.0.9",

    # Forced alignment and the ASR cross-check. torchaudio is deliberately
    # absent: it is frozen at 2.11 against torch 2.14 here, and its compiled
    # forced_align op is a version-coupling risk for one function. The Viterbi
    # pass lives in pipeline/align.py instead.
    "torch>=2.4",
    "transformers>=4.40",
    "numpy>=2.0",
]

# Phase 2 worker and job queue. psycopg 3 with the bundled libpq, so the Mac
# needs no Postgres client install to reach Neon or the compose.yaml database.
worker = [
    "psycopg[binary]==3.3.6",
    # docs.py parses beat bodies as YAML; the web app's validator function
    # pins the same version in web/requirements.txt.
    "pyyaml==6.0.3",
    # Phase 3: the media store behind work/cache (pipeline/media.py). Vercel's
    # own SDK; >= 0.5.0 is required for private stores.
    "vercel-blob==0.5.0",
]

[tool.uv]
package = false
